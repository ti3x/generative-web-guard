name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check:cdn
      - run: npm run test:js
      - name: Require committed CDN artifacts to be current
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain -- cdn/)" ]]; then
            git status --short -- cdn/
            git diff -- cdn/
            echo "Run npm run build and commit the updated cdn/ files."
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: generative-web-guard-${{ github.sha }}
          path: |
            dist/
            cdn/
          if-no-files-found: error
          retention-days: 14
