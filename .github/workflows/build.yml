name: Build and test

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The distribution EMBEDS the Lean/Wasm checker, so it cannot be assembled
  # without it and there is deliberately no JavaScript-only bundle variant.
  # This job therefore waits for the verification job and assembles the bundles
  # from the Wasm that job built from this checkout: the plan's order is build
  # and audit Lean first, build Wasm from those sources, assemble the
  # distribution, then test the exact assembled artifacts.
  browser-distribution:
    runs-on: ubuntu-latest
    needs: proofs-and-full-verification
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch the Wasm checker built from this checkout
        uses: actions/download-artifact@v4
        with:
          name: lean-wasm-${{ github.sha }}
          path: lean/wasm/dist
      - run: npm run build
      - run: npm run check:cdn
      - run: npm run test:js

      # Distinguish the two ways the next step can fail, because they need
      # different fixes. A checker-hash difference is NOT necessarily a stale
      # commit: cross-host byte reproducibility of the Emscripten output is not
      # something this repository has verified (two builds on one host are).
      - name: Compare the CI-built checker with the committed manifest
        shell: bash
        run: |
          set -euo pipefail
          built=$(shasum -a 256 lean/wasm/dist/guard.wasm | cut -d" " -f1)
          recorded=$(node -e 'process.stdout.write(require("./cdn/asset-manifest.json").checker.wasmSha256)')
          echo "checker built here: $built"
          echo "checker in commit:  $recorded"
          if [[ "$built" != "$recorded" ]]; then
            echo "::warning::The checker this runner built differs from the one the committed bundles embed."
            echo "Either cdn/ is stale (rebuild and commit) or the Emscripten output is not byte-identical"
            echo "across hosts. Check which before assuming the first."
          fi

      - name: Require committed CDN artifacts to be current
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain -- cdn/)" ]]; then
            git status --short -- cdn/
            git diff --stat -- cdn/
            echo "Run npm run wasm:build && npm run build and commit the updated cdn/ files."
            exit 1
          fi

      # Reproducibility: a second build of the same sources must produce the
      # same bytes. Compared after the staleness check so a stale commit is
      # reported as staleness, not as non-reproducibility.
      - name: Build twice and require identical output
        shell: bash
        run: |
          set -euo pipefail
          before=$(find cdn -type f | sort | xargs shasum -a 256 | shasum -a 256)
          npm run build >/dev/null
          after=$(find cdn -type f | sort | xargs shasum -a 256 | shasum -a 256)
          if [[ "$before" != "$after" ]]; then
            echo "npm run build is not reproducible on this host."
            git diff --stat -- cdn/
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: generative-web-guard-${{ github.sha }}
          path: |
            dist/
            cdn/
          if-no-files-found: error
          retention-days: 14

  # Full verification: build the pinned Lean toolchain images, build Lean and
  # Wasm from *this* checkout, audit theorem kinds and transitive axioms, and
  # run the whole suite against the freshly built engines.
  #
  # Deliberately unconditional: no path filters. Lean sources, rules/,
  # scripts/, src/, features/, tests, workflow logic and dependencies all feed
  # this job, and a filter that misses one of them silently drops the proof
  # gate. Documentation-only optimisation can come later, if ever.
  #
  # Only the toolchain images are cached; nothing derived from the sources is.
  # A cache hit restores a compiler, never a proof result, a Lean build
  # directory or a Wasm artifact.
  proofs-and-full-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # The cache key covers everything that determines the toolchain images:
      # the Dockerfile, the pinned Lean toolchain and the resolved manifest.
      - name: Restore cached Lean toolchain images
        id: toolchain-cache
        uses: actions/cache@v4
        with:
          path: ~/lean-images
          key: lean-toolchain-images-${{ runner.os }}-${{ hashFiles('lean/Dockerfile', 'lean/lean-toolchain', 'lean/lake-manifest.json') }}

      - name: Load cached toolchain images
        if: steps.toolchain-cache.outputs.cache-hit == 'true'
        shell: bash
        run: |
          set -euo pipefail
          docker load -i ~/lean-images/guard-lean-toolchain.tar
          docker load -i ~/lean-images/guard-lean-wasm.tar

      - name: Build pinned toolchain images
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        run: npm run setup:verification

      - name: Save toolchain images
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/lean-images
          docker save guard-lean-toolchain -o ~/lean-images/guard-lean-toolchain.tar
          docker save guard-lean-wasm -o ~/lean-images/guard-lean-wasm.tar

      # Fail with an actionable message instead of a mid-run Docker error.
      - name: Require both toolchain images
        shell: bash
        run: |
          set -euo pipefail
          for image in guard-lean-toolchain guard-lean-wasm; do
            if ! docker image inspect "$image" >/dev/null 2>&1; then
              echo "Missing toolchain image $image; npm run setup:verification did not produce it."
              exit 1
            fi
          done

      # Generated tables, limits, rule ids and the capability inventory must
      # already match their sources. `npm test` re-checks this first; running
      # it here attributes the failure clearly.
      - name: Reject stale generated files
        shell: bash
        run: |
          set -euo pipefail
          npm run check:rules
          npm run check:policy

      # The full gate: fresh Lean library and native checker, guard-tests,
      # theorem/axiom audit, fresh Wasm, unit + BDD + behavioural checks with
      # js, lean and wasm all required, and rule traceability.
      - run: npm test

      # The exact Wasm this job built and tested, for the jobs that assemble
      # and exercise the distribution. Nothing derived from the sources is
      # cached; this is an artifact of this run, not a restored build.
      - uses: actions/upload-artifact@v4
        with:
          name: lean-wasm-${{ github.sha }}
          path: lean/wasm/dist/
          if-no-files-found: error
          retention-days: 14

      # Generating into the working tree must not have changed anything, and
      # no build output belongs in the tree either.
      - name: Reject working-tree drift after verification
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$(git status --porcelain)" ]]; then
            git status --short
            git diff
            echo "Verification changed tracked files; regenerate and commit them."
            exit 1
          fi

  # Profile A (docs/csp.md) is a three-engine claim: cross-origin bundle
  # import, blob: Workers that inherit the document CSP, Wasm under
  # 'wasm-unsafe-eval', the Lean/Wasm acceptance checker instantiating inside
  # the policy Worker, the acceptance-record binding, the per-engine node
  # bound, and an acknowledged render in an opaque frame. No other job loads a
  # page, creates a Worker, or evaluates a CSP, so without this job those
  # claims are untested in CI.
  browser-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: proofs-and-full-verification
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The policy Worker instantiates the embedded Lean checker, and this is
      # the only job that finds out whether it can: Node cannot tell you
      # whether a browser Worker under the host CSP will compile it.
      - name: Fetch the Wasm checker built from this checkout
        uses: actions/download-artifact@v4
        with:
          name: lean-wasm-${{ github.sha }}
          path: lean/wasm/dist
      # Installs the revisions playwright-core 1.55.0 pins: chromium 1187,
      # firefox 1490, webkit 2203. scripts/browser-check.mjs accepts chromium
      # 1187 (140.0.7339.16) alongside the locally preferred 1193
      # (140.0.7339.186) and prints which build ran.
      - run: npx playwright-core install --with-deps chromium firefox webkit
      - run: npm run build
      - name: Serve the demo host and the second CDN origin
        shell: bash
        run: |
          PORT=8096 npm run serve &
          for i in $(seq 1 40); do curl -sf -o /dev/null http://localhost:8096/ && break; sleep 0.5; done
      - run: DEMO_URL=http://localhost:8096/ npm run check:browser

  # A release is created only after the same proof, distribution and browser
  # gates have passed for an immutable v* tag. `dist/` is useful as a download
  # for local demos; jsDelivr continues to serve the committed cdn/ files.
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [proofs-and-full-verification, browser-distribution, browser-matrix]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Fetch the verified distribution artifact
        uses: actions/download-artifact@v4
        with:
          name: generative-web-guard-${{ github.sha }}
      - name: Package the local demo distribution
        shell: bash
        run: |
          set -euo pipefail
          archive="generative-web-guard-${GITHUB_REF_NAME}-dist.zip"
          (cd dist && zip -r "../$archive" .)
          shasum -a 256 "$archive" > "$archive.sha256"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "generative-web-guard-${GITHUB_REF_NAME}-dist.zip" \
            "generative-web-guard-${GITHUB_REF_NAME}-dist.zip.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
