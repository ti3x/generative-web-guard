<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc">
  <title id="title">Generative Web Guard data flow and trust boundary</title>
  <desc id="desc">Generated HTML and QuickJS views enter the policy Worker. Parse5 builds a bounded raw tree, JavaScript proposes a candidate, and Lean WebAssembly accepts or refuses the exact candidate. Only Lean's accepted tree travels over a private port to DOM constructors in a sandboxed iframe. Frame events are schema-checked by the host before reaching QuickJS.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#eff6ff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1e3a5f" flood-opacity=".12"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/></marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#047857"/></marker>
    <style>
      .h { font: 700 32px system-ui, -apple-system, Segoe UI, sans-serif; fill: #0f172a; }
      .sub { font: 500 17px system-ui, -apple-system, Segoe UI, sans-serif; fill: #475569; }
      .boxh { font: 700 21px system-ui, -apple-system, Segoe UI, sans-serif; fill: #0f172a; }
      .boxp { font: 500 16px system-ui, -apple-system, Segoe UI, sans-serif; fill: #334155; }
      .small { font: 600 14px system-ui, -apple-system, Segoe UI, sans-serif; fill: #475569; letter-spacing: .05em; }
      .label { font: 700 14px system-ui, -apple-system, Segoe UI, sans-serif; fill: #fff; letter-spacing: .04em; }
      .arrow { fill: none; stroke: #334155; stroke-width: 3; marker-end: url(#arrow); }
      .green { fill: none; stroke: #047857; stroke-width: 4; marker-end: url(#arrowGreen); }
    </style>
  </defs>
  <rect width="1600" height="920" rx="32" fill="url(#bg)"/>
  <text x="72" y="78" class="h">Data flow and trust boundary</text>
  <text x="72" y="112" class="sub">Lean/Wasm is the production acceptance authority. JavaScript proposes; it never authorizes a render.</text>

  <rect x="58" y="158" width="470" height="570" rx="24" fill="#fff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
  <text x="90" y="207" class="small">UNTRUSTED GENERATED CONTENT</text>
  <rect x="90" y="244" width="406" height="128" rx="18" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <text x="118" y="287" class="boxh">Generated HTML / SVG</text>
  <text x="118" y="319" class="boxp">Raw markup; may contain malformed</text>
  <text x="118" y="344" class="boxp">or unsafe content.</text>
  <rect x="90" y="470" width="406" height="190" rx="18" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="118" y="513" class="boxh">QuickJS Worker</text>
  <text x="118" y="545" class="boxp">Generated JavaScript under memory,</text>
  <text x="118" y="570" class="boxp">stack, and time limits; no DOM,</text>
  <text x="118" y="595" class="boxp">network, storage, timers, or imports.</text>
  <rect x="118" y="615" width="174" height="26" rx="13" fill="#7c3aed"/>
  <text x="136" y="634" class="label">VIEW STRING ONLY</text>

  <rect x="592" y="158" width="500" height="570" rx="24" fill="#fff" stroke="#1d4ed8" stroke-width="3" filter="url(#shadow)"/>
  <text x="624" y="207" class="small">POLICY WORKER — BOUNDED PREPROCESSING</text>
  <rect x="624" y="244" width="436" height="92" rx="16" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <text x="650" y="281" class="boxh">1. parse5 → bounded raw tree</text>
  <text x="650" y="310" class="boxp">Input, depth, node, attribute, and byte limits.</text>
  <rect x="624" y="372" width="436" height="92" rx="16" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <text x="650" y="409" class="boxh">2. JavaScript builds a candidate</text>
  <text x="650" y="438" class="boxp">Proposal and diagnostics — not acceptance.</text>
  <rect x="624" y="500" width="436" height="128" rx="16" fill="#ecfdf5" stroke="#10b981" stroke-width="3"/>
  <text x="650" y="537" class="boxh">3. Lean/Wasm acceptCandidate</text>
  <text x="650" y="566" class="boxp">Accepts or refuses the exact canonical candidate.</text>
  <rect x="650" y="585" width="246" height="25" rx="13" fill="#047857"/>
  <text x="668" y="603" class="label">NO JAVASCRIPT FALLBACK</text>

  <rect x="1156" y="158" width="386" height="570" rx="24" fill="#fff" stroke="#047857" stroke-width="3" filter="url(#shadow)"/>
  <text x="1188" y="207" class="small">ISOLATED RENDERING</text>
  <rect x="1188" y="288" width="322" height="190" rx="18" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="1216" y="331" class="boxh">Sandboxed null-origin frame</text>
  <text x="1216" y="363" class="boxp">Private port receives only</text>
  <text x="1216" y="388" class="boxp">Lean's accepted tree.</text>
  <text x="1216" y="426" class="boxh">DOM constructors</text>
  <text x="1216" y="453" class="boxp">No HTML reparsing.</text>

  <path d="M496 308 H592" class="arrow"/>
  <path d="M496 565 H550 V308 H592" class="arrow"/>
  <text x="522" y="286" class="small">MARKUP</text>
  <text x="512" y="544" class="small">VIEW</text>
  <path d="M842 336 V372" class="arrow"/>
  <path d="M842 464 V500" class="arrow"/>
  <path d="M1092 564 H1156" class="green"/>
  <text x="1098" y="539" class="small">EXACT ACCEPTED TREE</text>

  <rect x="650" y="682" width="640" height="48" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="678" y="713" class="small">FRAME EVENTS → HOST EVENT-SCHEMA CHECK → QUICKJS UPDATE → NEXT VIEW</text>
  <path d="M1349 478 V754 H493 V660" class="arrow"/>

  <rect x="58" y="776" width="1484" height="92" rx="20" fill="#0f172a"/>
  <text x="90" y="816" style="font:700 18px system-ui, sans-serif;fill:#f8fafc">What Lean proves:</text>
  <text x="285" y="816" style="font:500 18px system-ui, sans-serif;fill:#cbd5e1">accepted candidates satisfy the fixed-point acceptance guarantee.</text>
  <text x="90" y="847" style="font:500 16px system-ui, sans-serif;fill:#94a3b8">Outside the theorem: parsing, codecs, C/Emscripten, trusted glue, QuickJS, browser behavior, and DOM rendering.</text>
</svg>
